name: release

# tag vX.Y.Z → tests → build → Trivy CRITICAL gate → push :vX.Y.Z, :X.Y and :latest → GitHub release
# Also runnable by hand (Actions → release → Run workflow, e.g. version "v0.1.0"): the tag is then
# created on the dispatched commit together with the GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v0.1.0"
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/pazka/bastonks
  TRIVY_IMAGE: mirror.gcr.io/aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  test:   # fmt, lint, typecheck, unit tests, then the browser e2e (BRIEF §10) on the synthetic board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Deno 2.9.7 (pinned, checksum-verified)
        run: |
          set -euo pipefail
          url=https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
          curl -fsSL -o /tmp/deno.zip "$url"
          echo "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490  /tmp/deno.zip" | sha256sum -c -
          sudo unzip -o -q /tmp/deno.zip -d /usr/local/bin && deno --version
      - run: deno ci            # frozen lockfile, minimum dependency age, no install scripts
      - run: deno task build    # front-end bundle embedded into the server
      - run: deno task check
      - run: deno task test
      - name: e2e (headless Chrome, software GL)
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium)" deno task e2e

  release:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Install Deno 2.9.7 (pinned, checksum-verified)
        run: |
          set -euo pipefail
          url=https://github.com/denoland/deno/releases/download/v2.9.7/deno-x86_64-unknown-linux-gnu.zip
          curl -fsSL -o /tmp/deno.zip "$url"
          echo "c6527f24f4b16031d3ae4fa9f658d5f11534c8d84ce7dc8502420280919c3490  /tmp/deno.zip" | sha256sum -c -
          sudo unzip -o -q /tmp/deno.zip -d /usr/local/bin && deno --version
      - uses: docker/setup-buildx-action@v3

      - name: Version from tag
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then echo "bad version: $tag" >&2; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "${tag#v}" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Build (local, for scanning)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bastonks:scan
          build-args: |
            VERSION=${{ steps.v.outputs.tag }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy gate (CRITICAL, fixable)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
              --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
              --db-repository mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db \
              bastonks:scan

      - name: Container smoke (same hardening as the box) + capability checks
        run: |
          set -euo pipefail
          # A cleaned synthetic snapshot in the volume and NO Trello credentials: the app must serve it, stale.
          deno run --allow-read --allow-write=/tmp/seed scripts/seed.ts /tmp/seed
          sudo chown -R 10001:10001 /tmp/seed
          docker create --name smoke --read-only --tmpfs /tmp --cap-drop ALL --user 10001:10001 \
            --security-opt no-new-privileges:true --pids-limit 128 --memory 512m \
            -v smoke-data:/data -p 127.0.0.1:8000:8000 bastonks:scan
          sudo docker cp -a /tmp/seed/. smoke:/data/
          docker start smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/healthz | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"]=="ok"'
          docker exec smoke /app/bastonks healthcheck
          docker exec smoke /app/bastonks smoke http://127.0.0.1:8000 --expect-stale
          docker logs smoke | tail -n 20
          docker rm -f smoke

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push :vX.Y.Z, :X.Y, :latest
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.tag }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.minor }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VERSION=${{ steps.v.outputs.tag }}
            REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha

      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${{ steps.v.outputs.tag }}"
          notes="Image: \`${IMAGE}:${tag}\` (also \`:latest\`). Deployment: see DEPLOY.md."
          if gh release view "$tag" >/dev/null 2>&1; then exit 0; fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            gh release create "$tag" --title "bastonks $tag" --notes "$notes" --verify-tag
          else
            gh release create "$tag" --title "bastonks $tag" --notes "$notes" --target "$GITHUB_SHA"
          fi

  # Box standard (Decision #16): every release goes live through hosh-deploy on the hosh.it box,
  # which verifies it and rolls back by itself. Repo variable HOSH_AUTODEPLOY=false disables this.
  deploy:
    needs: release
    if: vars.HOSH_AUTODEPLOY != 'false'
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.release.outputs.tag }}
    secrets: inherit
