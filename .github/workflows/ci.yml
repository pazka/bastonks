name: ci

# push to main / PR → tests → build → Trivy CRITICAL gate → hardened container smoke → (main only)
# push ghcr.io/pazka/bastonks:ci and :<sha>. Box standard (hosh-migration 11-BOX-STANDARD.md).
# agent/** branches get the same checks without a PR (nothing is pushed to ghcr for them).
on:
  push:
    branches: [main, 'agent/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/pazka/bastonks
  # Trivy from its image pinned by digest (no third-party action holding a token).
  TRIVY_IMAGE: mirror.gcr.io/aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa

jobs:
  test:   # fmt, lint, typecheck, unit tests, then the browser e2e (BRIEF §10) on the synthetic board
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Deno 2.9.8 (pinned, checksum-verified)
        run: |
          set -euo pipefail
          url=https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-unknown-linux-gnu.zip
          curl -fsSL -o /tmp/deno.zip "$url"
          echo "e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609  /tmp/deno.zip" | sha256sum -c -
          sudo unzip -o -q /tmp/deno.zip -d /usr/local/bin && deno --version
      - run: deno ci            # frozen lockfile, minimum dependency age, no install scripts
      - run: deno task build    # front-end bundle embedded into the server
      - run: deno task check
      - run: deno task test
      - name: e2e (headless Chrome, software GL)
        run: CHROME_PATH="$(command -v google-chrome || command -v chromium)" deno task e2e

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Deno 2.9.8 (pinned, checksum-verified)
        run: |
          set -euo pipefail
          url=https://github.com/denoland/deno/releases/download/v2.9.8/deno-x86_64-unknown-linux-gnu.zip
          curl -fsSL -o /tmp/deno.zip "$url"
          echo "e890975bc2549807bbcc0b584ffafda72cc7c93349dd99c80483dd784f6c4609  /tmp/deno.zip" | sha256sum -c -
          sudo unzip -o -q /tmp/deno.zip -d /usr/local/bin && deno --version
      - uses: docker/setup-buildx-action@v4

      - name: Build (local, for scanning)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: bastonks:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy gate (CRITICAL, fixable)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress \
            --db-repository mirror.gcr.io/aquasec/trivy-db,ghcr.io/aquasecurity/trivy-db \
            bastonks:scan

      - name: Container smoke (same hardening as the box) + capability checks
        run: |
          set -euo pipefail
          # A cleaned synthetic snapshot in the volume and NO Trello credentials: the app must serve it, stale.
          deno run --allow-read --allow-write=/tmp/seed scripts/seed.ts /tmp/seed
          sudo chown -R 10001:10001 /tmp/seed
          docker create --name smoke --read-only --tmpfs /tmp --cap-drop ALL --user 10001:10001 \
            --security-opt no-new-privileges:true --pids-limit 128 --memory 512m \
            -v smoke-data:/data -p 127.0.0.1:8000:8000 bastonks:scan
          sudo docker cp -a /tmp/seed/. smoke:/data/
          docker start smoke
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/healthz && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/healthz | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"]=="ok"'
          docker exec smoke /app/bastonks healthcheck
          docker exec smoke /app/bastonks smoke http://127.0.0.1:8000 --expect-stale
          docker logs smoke | tail -n 20
          docker rm -f smoke

      - name: Hardening comes from the image; /data is writable under it
        run: |
          set -euo pipefail
          # The image itself runs as 10001 (no --user here: a Dockerfile regression must show).
          test "$(docker image inspect --format '{{.Config.User}}' bastonks:scan)" = "10001:10001"
          # Empty volume + read-only rootfs: the app must create its own state under /data and stay up.
          docker run -d --name fresh --read-only --tmpfs /tmp --cap-drop ALL \
            --security-opt no-new-privileges:true --pids-limit 128 --memory 512m \
            -v fresh-data:/data bastonks:scan
          sleep 6
          test "$(docker inspect --format '{{.State.Running}}' fresh)" = true
          docker cp fresh:/data - | tar -t > /tmp/fresh.lst
          grep -qx 'data/.secrets/id-salt' /tmp/fresh.lst
          grep -qx 'data/img/' /tmp/fresh.lst
          docker rm -f fresh

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push :ci and :<sha>
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:ci
            ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
