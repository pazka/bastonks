# Read ONCE by `hosh-deploy register bastonks` on the box (box standard, Decision #16), which validates
# the compose hardening and pins the result in /etc/hosh-deploy/apps/bastonks.conf. Changing this file
# in the repo changes nothing on the box until someone re-registers there.
SERVICE=bastonks
IMAGE_REPO=ghcr.io/pazka/bastonks
IMAGE_VAR=APP_IMAGE
ENV_FILE=bastonks.env
HOST=bastonks.hosh.it
BIND=127.0.0.1:9130
HEALTH=/healthz
# Optional capability smoke run INSIDE the container after each deploy (non-zero ⇒ auto-rollback).
# The image has no shell: the binary runs the capability checks of DEPLOY.md §3 (≥ 100 Trees, ≥ 2 000
# Branches, no trello.com / e-mail / phone / patient code, no « Astuce Trello », image served, CSP, …).
POST_DEPLOY=/app/bastonks smoke http://127.0.0.1:8000
REPO=pazka/bastonks
